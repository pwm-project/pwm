<div class="dialogBody narrow">
    {{ text('Display_PasswordGeneration') }}
    <br><br>
    <table class="noborder">
        <tbody>
        @for (i of cellIndexes; track i; let isEven = $even) {
            @if (isEven) {
                <tr class="noborder">
                    <td class="noborder" style="padding-bottom: 5px;" width="20%">
                        <div class="link-randomPasswordValue"
                             [id]="'randomGen' + i"
                             style="visibility: visible;"
                             (click)="onChoosePassword($event)">
                        </div>
                    </td>
                    <td class="noborder" style="padding-bottom: 5px;" width="20%">
                        <div class="link-randomPasswordValue"
                             [id]="'randomGen' + (i + 1)"
                             style="visibility: visible;"
                             (click)="onChoosePassword($event)">
                        </div>
                    </td>
                </tr>
            }
        }
        </tbody>
    </table>
    <br><br>
    <table class="noborder">
        <tbody>
        <tr class="noborder">
            <td class="noborder">
                <button class="btn" id="moreRandomsButton" (click)="onMoreRandomsButtonClick()">
                    <span class="btn-icon pwm-icon pwm-icon-refresh"></span>
                    {{ text('Button_More') }}
                </button>
            </td>
            <td class="noborder" style="text-align:right;">
                <button class="btn" id="cancelRandomsButton" (click)="onCancelRandomsButtonClick()">
                    <span class="btn-icon pwm-icon pwm-icon-times"></span>
                    {{ text('Button_Cancel') }}
                </button>
            </td>
        </tr>
        </tbody>
    </table>
</div>
